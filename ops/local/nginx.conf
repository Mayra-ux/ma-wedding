# Proxy LOCAL del modo «como producción» (I-10; compose, perfil prod-local). No se despliega.
# - :8080 sirve invitacion/ como lo haría Vercel, con los MISMOS encabezados de vercel.json
#   (tests/test_ops_local.py verifica que coincidan).
# - :8000 reenvía a la API como lo haría el proxy de Render: AGREGA la IP del cliente al final de
#   X-Forwarded-For (lo que el cliente haya escrito queda a la izquierda). La API usa
#   TRUSTED_PROXY_HOPS=1 y toma la de la derecha (app/proxy.py).
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;            # sin IPs en logs (ADR 0019)
    sendfile on;
    client_body_temp_path /tmp/cuerpos;
    proxy_temp_path /tmp/proxy;

    # ---------------------------------------------------------------- invitación (Vercel)
    server {
        listen 8080;
        root /srv/invitacion;
        index index.html;

        # Encabezados de vercel.json (regla "/(.*)").
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location ~* \.(webp|svg|jpg)$ {
            # Regla de caché de vercel.json; add_header aquí reemplaza los de arriba: se repiten.
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        location / {
            try_files $uri $uri.html $uri/ =404;   # cleanUrls
        }
    }

    # ---------------------------------------------------------------- API + panel (Render)
    server {
        listen 8000;
        client_max_body_size 3m;   # la API aplica sus propios límites (4 KB / 64 KB / 2 MB)

        location / {
            proxy_pass http://api-prod:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
