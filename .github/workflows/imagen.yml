# Construye la imagen de la API (con el panel compilado) y la publica en GHCR (ADR 0030).
# Solo se ejecuta A MANO (workflow_dispatch): ningún push la dispara. Render descarga la imagen
# fijada por digest; él no construye, porque no admite el contexto adicional `panel-src`.
# Acciones fijadas por SHA (la etiqueta va en el comentario). Sin secretos propios: usa el
# GITHUB_TOKEN de la ejecución, con los permisos mínimos de abajo.
name: imagen

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: imagen
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # publicar en ghcr.io
      id-token: write # firmar la procedencia (attestation)
      attestations: write
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: nombre
        env:
          DUENO: ${{ github.repository_owner }}
        run: echo "imagen=ghcr.io/${DUENO,,}/ma-wedding-api" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Entrar a GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          build-contexts: |
            panel-src=./panel
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}:sha-${{ github.sha }}

      - name: Procedencia firmada
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.nombre.outputs.imagen }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Resumen (digest para Render)
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "Usa esta referencia fija en Render (servicio web y tareas):"
            echo
            echo "\`${IMAGEN}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
