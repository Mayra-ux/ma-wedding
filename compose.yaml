# Entorno LOCAL de desarrollo: API + Postgres 16 con datos ficticios.
# Copia .env.example a .env antes de `docker compose up`. Nunca uses datos reales aquí.
name: ma-wedding

services:
  api:
    build:
      context: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"   # solo accesible desde esta máquina
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Sin `ports`: la DB no se publica fuera de la red de compose.
    # Acceso local: docker compose exec db psql -U "$POSTGRES_USER" "$POSTGRES_DB"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
